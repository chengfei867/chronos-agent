# Builds the MkDocs site on every push to main and publishes it to the
# gh-pages branch. The site is NOT served from GitHub Pages until the user
# flips Settings → Pages → Source = gh-pages branch at R120 RC1 (private→
# public toggle is gated on user authorisation).
#
# In the meantime, this workflow's success/failure acts as a docs-site smoke
# test — it catches broken nav refs, stale links, and mkdocs-material plugin
# conflicts before they ever land in the doc-site URL.
#
# ADR cross-ref: docs/CONTEXT.md §5 R117 row, ADR-029/030 (the new pages
# evaluators.md and cost-tracking.md must build cleanly).

name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write   # gh-pages branch push
  pages: read
  id-token: write

concurrency:
  group: "docs-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: build & deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # mike / mkdocs versioning needs the full history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: docs-pip-${{ hashFiles('.github/workflows/docs.yml') }}
          restore-keys: docs-pip-

      - name: Install MkDocs + Material + extras
        run: |
          python -m pip install --upgrade pip
          # Pinned versions — material 9.x is the supported track for our
          # mkdocs.yml feature flags. Bump deliberately, never auto.
          pip install \
            "mkdocs==1.6.1" \
            "mkdocs-material==9.5.49" \
            "pymdown-extensions==10.12" \
            "mike==2.1.3"

      - name: Build site (strict — fail on any warning)
        # `--strict` turns broken-link warnings, missing-nav refs, and
        # extension load errors into hard build failures. This is what makes
        # the workflow useful as a smoke test even before publication.
        run: mkdocs build --strict

      - name: Upload artifact (for inspection on PRs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 7

      - name: Deploy to gh-pages
        # Only on push to main, never on PR. The gh-pages branch exists but
        # GitHub Pages is NOT yet serving from it (deferred to R120 RC1).
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "agent@hermes.ai"
          git config --local user.name "Hermes Agent"
          mkdocs gh-deploy --force --no-history --remote-branch gh-pages
